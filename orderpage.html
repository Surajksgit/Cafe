<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Online - Spice Route Café</title>
    <link rel="stylesheet" href="orderpage.css">
    <script src="orderpage.js" defer></script>
     <link rel="icon"  href="images/icon22.png">
    <!-- Importing Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
</head>

<body>

    <header class="new-header">
        <div class="header-inner">
            <a href="index.html" class="new-logo">
                <i data-lucide="coffee" class="logo-icon"></i>
                Spice Route Café
            </a>

            <div class="new-actions">
                <a href="index.html" class="order-btn">
                    Back to Home
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="order-layout">
            
            <!-- Menu Section -->
            <section class="menu-section">
                <h1 class="menu-title">The Menu</h1>
                <div id="products-list">
                    <!-- Products will be dynamically loaded here -->
                </div>
            </section>

            <!-- Cart Section -->
            <aside class="cart-section">
                <div class="cart-container">
                    <h2 class="cart-heading">
                        <i data-lucide="shopping-cart" class="logo-icon"></i> 
                        Your Order
                    </h2>
                    
                    <div id="cart-items">
                        <!-- Cart items will be dynamically loaded here -->
                        <p class="text-gray-400 text-sm">Your cart is currently empty. Add some spice!</p>
                    </div>

                    <div class="cart-summary">
                        <span>Total:</span>
                        <span id="cart-total">₹0.00</span>
                    </div>

                    <button id="checkout-btn" class="checkout-btn" disabled>
                        Proceed to Checkout
                    </button>
                    <div id="checkout-message" class="newsletter-message hidden" style="color: #86EFAC; margin-top: 1rem;"></div>
                </div>
            </aside>

        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            
            <div>
                <a style="text-decoration: none; font-weight: bolder; font-size: 20px; color: #D97706; " href="#" class="logo footer-logo">
                    <i data-lucide="coffee" class="logo-icon"></i>
                    Spice Route Café
                </a>
                <p class="footer-slogan">Brewed to Perfection, Served With Love</p>
            </div>

            <div id="contact" class="newsletter-signup">
                <p class="newsletter-heading">
                    Join our newsletter to receive exclusive updates and news!
                </p>
                <form onsubmit="handleNewsletterSignup(event)" class="newsletter-form">
                    <input type="email" placeholder="Enter your email" required
                            class="newsletter-input">
                    <button type="submit" class="btn-subscribe">
                        Subscribe
                    </button>
                </form>
                <div id="newsletter-message" class="newsletter-message hidden"></div>
            </div>

            <div class="footer-links">
                <a href="#" class="footer-link-item">Privacy</a>
                <a href="#" class="footer-link-item">Terms</a>
                <a href="#" class="footer-link-item">Cookies</a>
            </div>

        </div>

        <div class="copyright-section">
            <p>&copy; 2025 Spice Route Café. All Rights Reserved.</p>
            <div class="social-icons-footer">
                <a href="twitter_SpiceRouteCafe"><i data-lucide="twitter" class="social-icon-sm"></i></a>
                <a href="instagram_SpiceRouteCafe"><i data-lucide="instagram" class="social-icon-sm"></i></a>
                <a href="facebook_SpiceRouteCafe"><i data-lucide="facebook" class="social-icon-sm"></i></a>
                <a href="SpiceRouteCafe@gmail"><i data-lucide="mail" class="social-icon-sm"></i></a>
            </div>
        </div>
    </footer>

    
</body>
</html>
